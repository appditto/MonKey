name: CI

on:
  push:
    branches: [ master ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    container: 
      image: appditto/libvips:latest
    steps:
    - name: Check out code
      uses: actions/checkout@master

    - name: Run Tests
      run: |
        cd server
        go test ./...

